[project]
name = "ux-swarm"
version = "1.1.1"
description = "Synthetic UX testing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.8",
    "litellm>=1.83.0",
    "playwright>=1.58.0",
    "pydantic>=2.13.3",
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
ux-swarm = "ux_swarm.cli:cli"
swarm = "ux_swarm.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
